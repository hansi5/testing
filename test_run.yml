name: Test Run Every 5 Minutes

on:
  workflow_dispatch:      # manual trigger (best for testing)
  schedule:
    - cron: '*/5 * * * *' # every 5 minutes (UTC)

jobs:
  test-job:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test script
        run: |
          echo "GitHub Actions is working"
          python --version
